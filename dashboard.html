<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dash.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="dash.js" defer></script>
    <title>Game Dashboard</title>
</head>
<body>
    <div id="mainGrid">
        <h2 id="head">INITIALIZE THE ARENA</h2>
        <div id="playerInfo">
            <div id="playerGrid">
                <div class="playerInfo">
                    <h3 class="txt">PLAYER-1</h3>
                    <img src="assets/EDDY.jpg" alt="EDDY">
                    <h4 class="txt">EDDY</h4>
                    <h5 class="txt">ENTER YOUR NAME</h5>
                    <input type="text" id="P1NAME" placeholder="PLAYER-1">
                </div>
                <div>
                    <h1 class="txt">V/S</h1>
                </div>
                <div class="playerInfo">
                    <h3 class="txt">PLAYER-2</h3>
                    <img src="assets/LAW.jpg" alt="LAW">
                    <h4 class="txt">LAW</h4>
                    <h5 class="txt">ENTER YOUR NAME</h5>
                    <input type="text" id="P2NAME" placeholder="PLAYER-2">
                </div>
            </div>
        </div>
        <br>
        <h3 class="txt">SELECT MODE</h3>
        <br>
        <div id="modeSelection">
            <div class="mode" data-mode = "Extended" data-hp="2000" data-power="100" data-bgm="assets/extended.mp3" data-bg="assets/extended.png">
                <img src="assets/extended.png" alt="Extended">
                <h3 class="txt">EXTENDED</h3>
            </div>
            <div class="mode" data-mode = "Normal" data-hp="1200" data-power="100" data-bgm="assets/normal.mp3" data-bg="assets/normal.png">
                <img src="assets/normal.png" alt="normal">
                <h3 class="txt">NORMAL</h3>
            </div>
            <div class="mode" data-mode = "Quick" data-hp="1200" data-power="200" data-bgm="assets/quick.mp3" data-bg="assets/quick.png">
                <img src="assets/quick.png" alt="quick">
                <h3 class="txt">QUICK</h3>
            </div>
            <audio src="assets/button.mp3" id="buttonClick"></audio>
        </div>
        <br>
        <div >
            <button id="submit">BATTLE...</button>
        </div>
        <audio src="assets/dash.mp3" id="dashBGM" preload="auto" loop></audio>
    </div>

</body>
</html>
